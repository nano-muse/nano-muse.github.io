<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Language and theme before first paint: the saved choice, else the browser's.
      (function () {
        try {
          var d = document.documentElement;
          var s = localStorage.getItem("nm-lang");
          var l = s ? (s === "zh" ? "zh" : "en") : (/^zh/i.test(navigator.language || "") ? "zh" : "en");
          d.setAttribute("data-lang", l);
          d.lang = l === "zh" ? "zh-CN" : "en";
          var t = localStorage.getItem("nm-theme");
          if (t !== "dark" && t !== "light") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          d.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-en="Not found — nanoMuse" data-zh="没有这一页 — nanoMuse">Not found — nanoMuse</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/" aria-label="nanoMuse">
        <img src="/assets/mark.svg" alt="" width="24" height="24" />
        <span>nanoMuse</span>
      </a>
      <nav aria-label="Site">
        <a href="/docs/"><i class="en">Docs</i><i class="zh">文档</i></a>
        <a href="/#download"><i class="en">Download</i><i class="zh">下载</i></a>
        <a class="stars" id="stars" href="https://github.com/nano-muse/nanoMuse" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z" /></svg>
          <span>GitHub</span>
          <span class="n"></span>
        </a>
        <button class="switch" id="lang" type="button" aria-label="Switch language"><i class="en">中文</i><i class="zh">EN</i></button>
        <button class="switch" id="theme" type="button" aria-label="Switch between light and dark">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></svg>
        </button>
      </nav>
    </header>

    <main class="doc">
      <h1><i class="en">There is no page at this address.</i><i class="zh">这个地址上没有页面。</i></h1>
      <p class="lead">
        <i class="en">It may have moved when the site was rearranged. The <a href="/">homepage</a> has the demo and the downloads; the <a href="/docs/">docs</a> have everything else.</i>
        <i class="zh">它可能在站点整理时挪了位置。<a href="/">首页</a>有演示和下载；其余的都在<a href="/docs/">文档</a>里。</i>
      </p>
    </main>

    <script src="/site.js"></script>
  </body>
</html>
